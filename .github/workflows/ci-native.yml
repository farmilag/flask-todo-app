name: Flask CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/todo-ci.sqlite
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate Python code
        run: python -m compileall -q manage.py application migrations

      - name: Initialize SQLite database
        run: python manage.py db upgrade

      - name: Smoke test Flask server
        shell: bash
        run: |
          python manage.py runserver > flask.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            cat flask.log
          }
          trap cleanup EXIT

          status=$(curl --silent --show-error --fail \
            --retry 15 --retry-connrefused --retry-delay 1 --retry-max-time 30 \
            --max-time 3 --output response.html --write-out '%{http_code}' \
            http://127.0.0.1:7345/)
          echo "GET / returned HTTP $status"
          test "$status" = 200
